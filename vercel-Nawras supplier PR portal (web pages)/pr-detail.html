<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nawras — PR Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand">
        <span class="mark">Nawras</span>
        <div>
          <h1 id="pr-heading">Requisition details</h1>
          <div class="subtitle" id="pr-subtitle"></div>
        </div>
      </div>
      <a class="back-link" href="index.html">← Back to open requisitions</a>
    </header>

    <div id="meta-wrap"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-sort="line">Line <span class="sort-indicator"></span></th>
            <th>Item</th>
            <th>Description</th>
            <th>Unit</th>
            <th>Order qty</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="state" class="loading">Loading requisition…</div>
    </div>

    <div class="footnote">
      <strong>How to quote:</strong> send your pricing, payment terms, and delivery terms for the
      items above directly to your buyer's email.
    </div>
  </div>

  <script src="config.js"></script>
  <script src="people.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentLines = [];
    let lineSortDir = "asc";

    function sortLines(lines, dir) {
      const sorted = lines.slice().sort((a, b) => {
        const na = parseInt(a.line, 10);
        const nb = parseInt(b.line, 10);
        if (Number.isNaN(na) || Number.isNaN(nb)) return 0;
        return na - nb;
      });
      return dir === "asc" ? sorted : sorted.reverse();
    }

    function updateLineSortIndicator() {
      const indicator = document.querySelector('th[data-sort="line"] .sort-indicator');
      if (indicator) indicator.textContent = lineSortDir === "asc" ? "▲" : "▼";
    }

    document.querySelector('th[data-sort="line"]').addEventListener("click", () => {
      lineSortDir = lineSortDir === "asc" ? "desc" : "asc";
      updateLineSortIndicator();
      renderLines(sortLines(currentLines, lineSortDir));
    });

    function esc(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function getPrNo() {
      const params = new URLSearchParams(window.location.search);
      return params.get("pr");
    }

    function renderMeta(pr) {
      const wrap = document.getElementById("meta-wrap");
      const fields = [
        ["Requester", personHtml(pr.requester, { stripCode: true }), true],
        ["Buyer", personHtml(pr.buyer, { stripCode: false }), true],
        ["Department", esc(pr.department), false],
        ["Date", esc(pr.pr_date), false],
        ["Reference", esc(pr.reference) || '<span class="muted">—</span>', false],
      ];
      wrap.innerHTML = `
        <div class="detail-meta">
          ${fields
            .map(
              ([label, value]) => `
                <div>
                  <div class="field-label">${esc(label)}</div>
                  <div class="field-value">${value}</div>
                </div>
              `
            )
            .join("")}
        </div>
      `;

      document.getElementById("pr-heading").innerHTML = `
        Requisition <span class="tag">${esc(pr.pr_no)}</span>
      `;
      document.getElementById("pr-subtitle").textContent = pr.justification || "";
    }

    function renderLines(lines) {
      const tbody = document.getElementById("rows");
      const state = document.getElementById("state");

      if (!lines.length) {
        tbody.innerHTML = "";
        state.textContent = "No line items found for this requisition.";
        state.className = "empty";
        state.style.display = "block";
        return;
      }

      state.style.display = "none";
      tbody.innerHTML = lines
        .map(
          (l) => `
            <tr>
              <td data-label="Line">${esc(l.line)}</td>
              <td data-label="Item">${esc(l.item)}</td>
              <td data-label="Description">${esc(l.description) || '<span class="muted">—</span>'}</td>
              <td data-label="Unit">${esc(l.unit)}</td>
              <td data-label="Order qty">${esc(l.order_qty)}</td>
            </tr>
          `
        )
        .join("");
    }

    async function load() {
      const prNo = getPrNo();
      const state = document.getElementById("state");

      if (!prNo) {
        state.textContent = "No requisition specified.";
        state.className = "error";
        return;
      }

      try {
        const [{ data: prRows, error: prError }, { data: lineRows, error: lineError }] =
          await Promise.all([
            client.from("pr_list").select("*").eq("pr_no", prNo).limit(1),
            client.from("pr_lines").select("*").eq("pr_no", prNo),
          ]);

        if (prError) throw prError;
        if (lineError) throw lineError;

        if (!prRows || !prRows.length) {
          state.textContent =
            "This requisition is no longer open (it may have been converted to a purchase order or cancelled).";
          state.className = "empty";
          document.getElementById("pr-heading").textContent = "Requisition unavailable";
          return;
        }

        const sortedLines = sortLines(lineRows || [], lineSortDir);
        currentLines = lineRows || [];

        renderMeta(prRows[0]);
        renderLines(sortedLines);
        updateLineSortIndicator();
      } catch (e) {
        state.textContent = "Couldn't load this requisition. Please refresh, or contact your buyer.";
        state.className = "error";
        state.style.display = "block";
        console.error(e);
      }
    }

    load();
  </script>
</body>
</html>
